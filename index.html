<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d67">
<title>معايير COPC</title>
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<div class="login">
  <div class="loginbox">
    <div class="logoBox">COPC</div>
    <h1>معايير COPC</h1>
    <div class="lead">منصة تطوير الموظفين وإدارة الأداء</div>
    <div class="field">
      <label for="role">نوع الحساب</label>
      <select id="role" class="select">
        <option value="supervisor">مشرفة — وجدان</option>
        <option value="employee">موظفة — سارة أحمد</option>
      </select>
    </div>
    <div class="field">
      <label for="username">اسم المستخدم</label>
      <input id="username" class="input" value="وجدان" readonly>
    </div>
    <button id="loginBtn" class="btn" style="width:100%;margin-top:8px">تسجيل الدخول</button>
    <div id="loginStatus" class="muted" style="text-align:center;margin-top:10px"></div>
  </div>
</div>
<script>
(function(){
  var role=document.getElementById('role');
  var username=document.getElementById('username');
  var btn=document.getElementById('loginBtn');
  role.addEventListener('change',function(){
    username.value=role.value==='supervisor'?'وجدان':'سارة أحمد';
  });
  btn.addEventListener('click',function(){
    btn.disabled=true;
    btn.textContent='جارٍ الدخول...';
    location.href=role.value==='supervisor'?'supervisor.html':'employee-home.html';
  });
})();
</script>
</body>
</html>
