<div id="toast" class="toast hide"></div><div id="modalBack" class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="iconbtn" onclick="closeModal()">×</button></div><div id="modalContent"></div></div></div>
<script>
const KEY="maayir-copc-demo-v2";
const seed=[
["سارة أحمد",97.8,"3:05",98,94,91,96,93,"ممتاز"],
["ريم محمد",94.6,"3:18",97,91,89,94,91,"ممتاز"],
["نورة خالد",91.3,"3:26",96,88,87,92,89,"ممتاز"],
["جود عبدالله",88.7,"3:31",95,85,84,90,87,"جيد"],
["هند علي",84.2,"3:42",94,81,82,87,84,"جيد"],
["لطيفة سالم",79.5,"3:58",92,78,79,83,80,"يحتاج تطوير"],
["مشاعل حسن",74.1,"4:10",90,73,75,79,76,"يحتاج تطوير"],
["أمل يوسف",68.9,"4:25",88,69,70,75,71,"يحتاج تطوير"],
["رغد إبراهيم",61.7,"4:46",85,62,65,68,64,"متابعة مكثفة"],
["شهد ماجد",53.4,"5:02",81,54,57,61,58,"متابعة مكثفة"]
];
function freshDB(){return {employees:seed.map((x,i)=>({id:i+1,name:x[0],score:x[1],aht:x[2],abs:x[3],quality:x[4],util:x[5],csat:x[6],fcr:x[7],status:x[8],notes:[],sessions:i<3?[{type:"Side by Side",date:"2026-09-05",note:"مراجعة مكالمة ناجحة وتعزيز أفضل الممارسات"}]:[]})),currentRole:"supervisor",selected:1}}
function db(){try{return JSON.parse(localStorage.getItem(KEY))||freshDB()}catch(e){return freshDB()}}
let state=db(); if(!localStorage.getItem(KEY)) save(state);
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function initials(n){return n.split(" ").slice(0,2).map(x=>x[0]).join("")}
function getEmp(){return state.employees.find(e=>e.id==state.selected)||state.employees[0]}
function nav(active){
 document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("on",x.dataset.nav===active));
}
function layout(active){
 nav(active);
 const name=state.currentRole==="employee"?"حساب الموظفة":"حساب المشرفة";
 document.querySelectorAll(".roleName").forEach(x=>x.textContent=name);
}
function go(url){location.href=url}
function toast(msg){
 const t=document.getElementById("toast"); if(!t)return;
 t.textContent=msg;t.classList.remove("hide");clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>t.classList.add("hide"),2200);
}
function setRole(r){state.currentRole=r;save(state)}
function openEmployee(id){state.selected=id;save(state);go("employee.html")}
function resetDemo(){if(confirm("إعادة بيانات النسخة التجريبية؟")){state=freshDB();save(state);toast("تمت إعادة البيانات");setTimeout(()=>location.reload(),500)}}
function logout(){state.currentRole=null;save(state);go("index.html")}
function metric(label,value,target,unit="",pct=null){
 pct=pct===null?Math.min(100,Number(value)||0):pct;
 return `<div class="card metric"><div class="name">${label}</div><div class="value">${value}${unit}</div><div class="target">Target ${target}${unit}</div><div class="progress ${pct<80?"bad":pct<90?"warn":""}"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;
}
function employeeCard(e){
 return `<div class="card employee" onclick="openEmployee(${e.id})">
 <div class="employee-top"><div class="avatar">${initials(e.name)}</div><div class="grow"><b>${e.name}</b><div class="sub">KPI · ${e.status}</div></div><div class="score-mini">${e.score}%</div></div>
 <div class="rankbar"><i style="width:${e.score}%"></i></div>
 <div class="employee-foot"><span>Quality ${e.quality}%</span><span class="pill ${e.score<80?"bad":e.score<90?"warn":""}">${e.status}</span></div></div>`;
}
function saveEmployeeFields(id){
 const e=state.employees.find(x=>x.id==id);
 ["score","abs","quality","util","csat","fcr"].forEach(k=>e[k]=Number(document.getElementById("m_"+k).value));
 e.aht=document.getElementById("m_aht").value;
 e.status=e.score>=90?"ممتاز":e.score>=80?"جيد":e.score>=65?"يحتاج تطوير":"متابعة مكثفة";
 save(state); closeModal(); renderEmployeePage(); toast("تم حفظ بيانات الموظفة");
}
function modal(title,body){
 const back=document.getElementById("modalBack"); if(!back)return;
 document.getElementById("modalTitle").textContent=title;document.getElementById("modalContent").innerHTML=body;back.classList.add("open");
}
function closeModal(){document.getElementById("modalBack")?.classList.remove("open")}
function editEmployee(id){
 const e=state.employees.find(x=>x.id==id);
 modal("تعديل بيانات الموظفة",`
 <label class="label">النتيجة الموزونة %</label><input id="m_score" class="input" type="number" step=".1" value="${e.score}">
 <label class="label">AHT</label><input id="m_aht" class="input" value="${e.aht}">
 <label class="label">Absenteeism %</label><input id="m_abs" class="input" type="number" value="${e.abs}">
 <label class="label">Quality %</label><input id="m_quality" class="input" type="number" value="${e.quality}">
 <label class="label">Utilization %</label><input id="m_util" class="input" type="number" value="${e.util}">
 <label class="label">C-SAT %</label><input id="m_csat" class="input" type="number" value="${e.csat}">
 <label class="label">FCR %</label><input id="m_fcr" class="input" type="number" value="${e.fcr}">
 <div class="modal-actions"><button class="btn" onclick="saveEmployeeFields(${id})">حفظ التغييرات</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
}
function saveSession(id){
 const e=state.employees.find(x=>x.id==id);
 e.sessions.push({type:document.getElementById("sType").value,date:document.getElementById("sDate").value,note:document.getElementById("sNote").value||"جلسة تطوير ومتابعة الأداء"});
 save(state);closeModal();renderEmployeePage?.();renderSessions?.();toast("تم تسجيل الجلسة");
}
function addSession(id=state.selected){
 modal("إضافة جلسة تطوير",`
 <label class="label">نوع الجلسة</label><select id="sType" class="select"><option>Coaching</option><option>Side by Side</option><option>Monthly Performance</option></select>
 <label class="label">التاريخ</label><input id="sDate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}">
 <label class="label">ملاحظات الجلسة</label><textarea id="sNote" class="textarea" rows="4" placeholder="اكتبي الملاحظة وخطة المتابعة..."></textarea>
 <div class="modal-actions"><button class="btn" onclick="saveSession(${id})">حفظ الجلسة</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
}
function saveReview(id){
 const e=state.employees.find(x=>x.id==id); e.notes=e.notes||[];
 e.notes.push({date:new Date().toISOString().slice(0,10),strength:document.getElementById("rStrength").value,improve:document.getElementById("rImprove").value,challenges:document.getElementById("rChallenges").value,plan:document.getElementById("rPlan").value});
 save(state);closeModal();toast("تم حفظ Monthly Review");renderEmployeePage?.();
}
function monthlyReview(id=state.selected){
 modal("Monthly Performance Review",`
 <div class="notice">مراجعة شهرية منظمة: نقاط القوة، فرص التحسين، التحديات، وخطة الشهر القادم.</div>
 <label class="label">نقاط القوة</label><textarea id="rStrength" class="textarea" rows="3"></textarea>
 <label class="label">فرص التحسين</label><textarea id="rImprove" class="textarea" rows="3"></textarea>
 <label class="label">التحديات</label><textarea id="rChallenges" class="textarea" rows="3"></textarea>
 <label class="label">خطة العمل للشهر القادم</label><textarea id="rPlan" class="textarea" rows="3"></textarea>
 <div class="modal-actions"><button class="btn" onclick="saveReview(${id})">حفظ المراجعة</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`);
}
function printEmployee(id){
 const e=state.employees.find(x=>x.id==id),w=window.open("","_blank");
 if(!w){toast("اسمحي بالنوافذ المنبثقة للطباعة");return}
 w.document.write(`<html dir="rtl"><head><title>تقرير ${e.name}</title><style>body{font-family:Arial;padding:30px;color:#17345f}h1{color:#0d766d}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:10px}</style></head><body><h1>معايير COPC</h1><h2>تقرير ${e.name}</h2><h3>${e.score}% — ${e.status}</h3><table><tr><th>KPI</th><th>النتيجة</th><th>Target</th></tr><tr><td>AHT</td><td>${e.aht}</td><td>3:30</td></tr><tr><td>Absenteeism</td><td>${e.abs}%</td><td>95%</td></tr><tr><td>Quality</td><td>${e.quality}%</td><td>80%</td></tr><tr><td>Utilization</td><td>${e.util}%</td><td>85%</td></tr><tr><td>C-SAT</td><td>${e.csat}%</td><td>—</td></tr><tr><td>FCR</td><td>${e.fcr}%</td><td>—</td></tr></table></body></html>`);
 w.document.close();setTimeout(()=>w.print(),300);
}
