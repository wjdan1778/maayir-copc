<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="v10-independent"><title>معايير COPC</title><style>
:root{--navy:#203a63;--green:#8bc84f;--green2:#2d8c7d;--orange:#e6a23c;--red:#d9535d;--purple:#a795e8;--bg:#f4f6f8;--white:#fff;--text:#243a55;--muted:#7b8797;--line:#e5e9ee;--softgreen:#edf8e4;--softorange:#fff5e3;--softred:#ffeaec;--softpurple:#f2effc}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}
.header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-weight:950;font-size:22px;color:var(--navy)}.brand span{color:var(--green2)}.sub{color:var(--muted);font-size:12px;margin-top:2px}.head-actions{display:flex;gap:9px;align-items:center}
.layout{display:flex;min-height:calc(100vh - 76px)}.side{width:250px;background:#fff;border-left:1px solid var(--line);padding:18px;flex:none}.navtitle{font-size:11px;color:var(--muted);margin:14px 8px 7px}.nav a{display:block;padding:11px 12px;border-radius:12px;font-weight:850;margin:3px 0}.nav a:hover,.nav a.active{background:#edf7f4;color:var(--green2)}
.main{width:100%;max-width:1280px;margin:auto;padding:27px}.hero{background:linear-gradient(135deg,#edf8f5,#f3effc);border:1px solid var(--line);border-radius:23px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 5px;font-size:28px;color:var(--navy)}.hero p{margin:0;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 4px 18px rgba(30,55,80,.035)}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:30px;font-weight:950;color:var(--navy);margin-top:4px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h2{margin:0;color:var(--navy);font-size:19px}.muted{color:var(--muted);font-size:13px}
.btn{display:inline-block;border:0;border-radius:11px;background:var(--green2);color:#fff;padding:10px 15px;font-weight:900;cursor:pointer}.btn.soft{background:#eef2f4;color:var(--text)}.btn.purple{background:var(--purple)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange)}.full{width:100%;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:900}.excellent{background:var(--softgreen);color:#568f30}.good{background:var(--softorange);color:#b87418}.low{background:var(--softred);color:#bd3f49}
.score{font-size:30px;font-weight:950}.score.excellent-text{color:#568f30}.score.good-text{color:#c27b1c}.score.low-text{color:#c8434c}
.bar{height:9px;background:#e9edf1;border-radius:20px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;border-radius:20px}.bar.green i{background:var(--green)}.bar.orange i{background:var(--orange)}.bar.red i{background:var(--red)}
.shortcut{display:flex;align-items:center;gap:13px;min-height:94px}.ico{width:46px;height:46px;border-radius:14px;background:#edf7f4;display:grid;place-items:center;font-size:22px;flex:none}.shortcut h3{margin:0 0 4px}.shortcut p{margin:0;color:var(--muted);font-size:12px}
.tablewrap{overflow:auto}.table{border-collapse:collapse;width:100%;min-width:800px}.table th,.table td{text-align:right;padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:15px;border-radius:15px;margin:8px 0}.alert.red{background:var(--softred);border-right:4px solid var(--red)}.alert.orange{background:var(--softorange);border-right:4px solid var(--orange)}.alert.green{background:var(--softgreen);border-right:4px solid var(--green)}.alert h3{margin:0 0 5px;font-size:15px}.alert p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.kpi{min-height:145px}.kpi .name{font-weight:900}.kpi .val{font-size:25px;font-weight:950;color:var(--navy);margin-top:3px}.target{font-size:12px;color:var(--muted)}
.note{padding:13px 14px;border-radius:13px;background:#fbfbfd;border-right:4px solid var(--purple);margin:8px 0;line-height:1.65}.note strong{display:block;color:var(--navy);margin-bottom:3px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f2f7f6,#f1effb)}.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:31px;box-shadow:0 18px 50px rgba(30,55,80,.08)}.logoBox{width:78px;height:78px;border-radius:23px;background:var(--green2);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:950;margin:0 auto 16px}.login h1{text-align:center;margin:0;color:var(--navy);font-size:27px}.login .lead{text-align:center;color:var(--muted);margin:6px 0 25px}.field{margin:12px 0}.field label{display:block;font-weight:850;margin-bottom:7px}.input,.select,.textarea{width:100%;padding:12px;border:1px solid #dfe5e9;border-radius:11px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--green2)}
.employeeHeader{background:#fff;border-bottom:1px solid var(--line);padding:19px 28px;display:flex;align-items:center;justify-content:space-between}.profile{display:flex;gap:13px;align-items:center}.avatar{width:55px;height:55px;border-radius:50%;background:#c8b9ed;display:grid;place-items:center;font-size:26px}.bottom{display:none}
@media(max-width:900px){.side{display:none}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.main{padding:17px}.header,.employeeHeader{padding:14px 16px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;height:68px;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:40;justify-content:space-around}.bottom a{padding:8px;text-align:center;font-size:11px;color:var(--muted);font-weight:850}.bottom b{display:block;font-size:20px}}
@media(max-width:560px){.grid4,.grid3,.grid2{grid-template-columns:1fr}.hero h1{font-size:22px}.main{padding-bottom:90px}.loginbox{padding:24px}}
</style></head><body></body><script>
const DATA=[{"id":1,"name":"سارة أحمد","score":97.8,"aht":"3:05","abs":98,"quality":94,"util":91,"csat":96,"fcr":93},{"id":2,"name":"ريم محمد","score":94.6,"aht":"3:18","abs":97,"quality":91,"util":89,"csat":94,"fcr":91},{"id":3,"name":"نورة خالد","score":91.3,"aht":"3:26","abs":96,"quality":88,"util":87,"csat":92,"fcr":89},{"id":4,"name":"جود عبدالله","score":88.7,"aht":"3:31","abs":95,"quality":85,"util":84,"csat":90,"fcr":87},{"id":5,"name":"هند علي","score":84.2,"aht":"3:42","abs":94,"quality":81,"util":82,"csat":87,"fcr":84},{"id":6,"name":"لطيفة سالم","score":79.5,"aht":"3:58","abs":92,"quality":78,"util":79,"csat":83,"fcr":80},{"id":7,"name":"مشاعل حسن","score":74.1,"aht":"4:10","abs":90,"quality":73,"util":75,"csat":79,"fcr":76},{"id":8,"name":"أمل يوسف","score":68.9,"aht":"4:25","abs":88,"quality":69,"util":70,"csat":75,"fcr":71},{"id":9,"name":"رغد إبراهيم","score":61.7,"aht":"4:46","abs":85,"quality":62,"util":65,"csat":68,"fcr":64},{"id":10,"name":"شهد ماجد","score":53.4,"aht":"5:02","abs":81,"quality":54,"util":57,"csat":61,"fcr":58}];
const KEY='maayir-copc-independent-v10';
const S=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.employees?.length===10?x:{employees:DATA,reviews:[],sessions:[]}}catch(e){return {employees:DATA,reviews:[],sessions:[]}}})();
localStorage.setItem(KEY,JSON.stringify(S));
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function emp(id){return S.employees.find(e=>+e.id===+id)||S.employees[0]}
function status(x){return x>=90?'ممتاز':x>=80?'جيد':'منخفض'}
function cls(x){return x>=90?'excellent':x>=80?'good':'low'}
function textCls(x){return x>=90?'excellent-text':x>=80?'good-text':'low-text'}
function actionFor(e){if(e.score>=90)return 'استمرار الأداء المتميز + مشاركة أفضل الممارسات';if(e.score>=80)return 'متابعة شهرية + تحسين المؤشرات الأقل من الهدف';if(e.score>=65)return 'Coaching + خطة تحسين شهرية + متابعة أسبوعية';return 'Coaching عاجل + خطة تحسين مكثفة + متابعة أسبوعية'}
function noteFor(e){let n=[];if(e.quality<80)n.push('رفع الجودة ومراجعة أخطاء المكالمات وتوثيق الإجراء التصحيحي.');if(e.util<85)n.push('رفع الانشغالية ومراجعة توزيع وقت العمل.');if(e.csat<80)n.push('تحسين تجربة العميل ووضوح الحل من أول تواصل.');if(e.fcr<80)n.push('تعزيز الحل من أول مكالمة وتقليل إعادة التواصل.');if(e.aht>'3:30')n.push('خفض AHT تدريجيًا مع المحافظة على الجودة.');if(!n.length)n.push('الحفاظ على المستوى الحالي وتوثيق أفضل الممارسات.');return n}
function nav(a){return `<aside class="side"><div class="navtitle">لوحة المشرفة</div><div class="nav">
<a class="${a==='home'?'active':''}" href="supervisor.html">🏠 الرئيسية</a>
<div class="navtitle">إدارة الفريق</div><a class="${a==='employees'?'active':''}" href="supervisor-employees.html">👩🏻‍💼 الموظفات</a><a href="supervisor-performance.html">📊 الأداء العام</a>
<div class="navtitle">التطوير</div><a href="supervisor-alerts.html">🔔 التنبيهات والمتابعة</a><a href="supervisor-development.html">📝 ملاحظات التطوير</a><a href="supervisor-sessions.html">💬 الجلسات</a>
<div class="navtitle">التقارير</div><a href="supervisor-reports.html">📈 التقارير</a></div></aside>`}
function supShell(title,active,body){document.body.innerHTML=`<header class="header"><div><div class="brand">معايير <span>COPC</span></div><div class="sub">حساب المشرفة — وجدان</div></div><div class="head-actions"><a class="btn soft" href="employee-home.html">حساب سارة</a><a class="btn soft" href="index.html">خروج</a></div></header><div class="layout">${nav(active)}<main class="main">${body}<footer>معايير COPC • لوحة المشرفة</footer></main></div><nav class="bottom"><a href="supervisor.html"><b>⌂</b>الرئيسية</a><a href="supervisor-employees.html"><b>👥</b>الموظفات</a><a href="supervisor-performance.html"><b>▦</b>الأداء</a><a href="supervisor-alerts.html"><b>🔔</b>التنبيهات</a></nav>`}
function empShell(body){document.body.innerHTML=`<header class="employeeHeader"><div class="profile"><div class="avatar">👩🏻‍💼</div><div><div class="brand">معايير <span>COPC</span></div><div class="sub">حساب الموظفة — سارة أحمد</div></div></div><a class="btn soft" href="index.html">تسجيل الخروج</a></header><main class="main">${body}<footer>معايير COPC • الملف الشخصي للموظفة</footer></main><nav class="bottom"><a href="employee-home.html"><b>⌂</b>الرئيسية</a><a href="employee-kpi.html"><b>📊</b>الأداء</a><a href="employee-monthly.html"><b>🗓</b>المراجعة</a><a href="employee-coaching.html"><b>💬</b>الجلسات</a></nav>`}
function kpiCard(e,key,name,target){let val=e[key];let width=key==='aht'?Math.min(100,210/parseTime(val)*100):val;let color=key==='aht'?(parseTime(val)<=210?'green':'orange'):(val>=90?'green':val>=80?'orange':'red');return `<div class="card kpi"><div class="name">${name}</div><div class="target">Target ${target}</div><div class="val">${val}${key==='aht'?'':'%'}</div><div class="bar ${color}"><i style="width:${width}%"></i></div></div>`}
function parseTime(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}
function openNote(e){alert(actionFor(e))}
function enter(){let r=document.getElementById('role').value;location.href=r==='supervisor'?'supervisor.html':'employee-home.html'}
</script><script>
let e=emp(1);
empShell(`<div class="hero"><h1>الأداء و KPI</h1><p>${e.name} • نتيجتك الإجمالية <b>${e.score}%</b></p></div><div class="grid4">${kpiCard(e,'aht','AHT','3:30')}${kpiCard(e,'abs','Absenteeism','95%')}${kpiCard(e,'quality','Quality','80%')}${kpiCard(e,'util','Utilization','85%')}</div><div class="grid2" style="margin-top:15px"><div class="card"><div class="label">C-SAT</div><div class="score ${textCls(e.csat)}">${e.csat}%</div><div class="target">رضا العميل</div></div><div class="card"><div class="label">FCR</div><div class="score ${textCls(e.fcr)}">${e.fcr}%</div><div class="target">الحل من أول مكالمة</div></div></div>`);
</script></html>
