<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="v8"><title>معايير COPC</title><style>
:root{--navy:#19365f;--green:#278b7c;--teal:#40b7a5;--lav:#8b7bd8;--bg:#f4f7f7;--white:#fff;--text:#203b42;--muted:#718489;--line:#e2eaea;--soft:#edf7f5;--warn:#fff3dc;--danger:#ffe9eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}a{text-decoration:none;color:inherit}
.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:900;color:var(--navy)}.logo span{color:var(--green)}.headsub{color:var(--muted);font-size:12px;margin-top:2px}.head-actions{display:flex;gap:8px;align-items:center}
.layout{display:flex;min-height:calc(100vh - 72px)}.side{width:245px;background:#fff;border-left:1px solid var(--line);padding:18px;flex:none}.nav-label{font-size:11px;color:var(--muted);margin:14px 8px 7px}.nav a{display:block;padding:11px 12px;border-radius:12px;font-weight:800;margin:3px 0}.nav a:hover,.nav a.active{background:var(--soft);color:var(--green)}
.main{max-width:1250px;width:100%;padding:26px;margin:auto}.hero{background:linear-gradient(135deg,#eaf7f4,#f0edff);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:20px}.hero h1{margin:0 0 6px;color:var(--navy);font-size:27px}.hero p{margin:0;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(32,59,66,.04)}.stat .num{font-size:28px;font-weight:900;color:var(--navy);margin-top:5px}.muted{color:var(--muted);font-size:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section h2{font-size:19px;margin:0;color:var(--navy)}
.shortcut{display:flex;align-items:center;gap:12px;min-height:96px}.shortcut .ico{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:23px}.shortcut h3{margin:0 0 4px}.shortcut p{margin:0;color:var(--muted);font-size:12px}
.btn{border:0;background:var(--green);color:#fff;padding:10px 15px;border-radius:11px;font-weight:900;cursor:pointer;display:inline-block}.btn.lav{background:var(--lav)}.btn.soft{background:#edf2f2;color:var(--text)}.btn.navy{background:var(--navy)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:var(--soft);color:var(--green);font-size:12px;font-weight:900}.pill.warn{background:#fff0dc;color:#b86a12}.pill.bad{background:#ffe7e9;color:#c43d49}.pill.good{background:#fff0dc;color:#b86a12}.pill.excellent{background:#e6f7f2;color:#16846f}.score-good{color:#b86a12!important}.score-low{color:#c43d49!important}.score-excellent{color:#16846f!important}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}.table th{color:var(--muted)}
.kpi{position:relative}.kpi-name{font-weight:900}.kpi-val{font-size:25px;font-weight:900;color:var(--navy);margin-top:4px}.bar{height:8px;border-radius:20px;background:#edf1f1;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}
.note{border-right:4px solid var(--lav);background:#faf9ff;border-radius:12px;padding:13px;margin:8px 0}.note strong{display:block;margin-bottom:5px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f3f8f7,#f0effb)}.loginbox{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 15px 45px rgba(25,54,95,.08)}.brandmark{width:76px;height:76px;border-radius:22px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900;margin:0 auto 16px}.login h1{text-align:center;color:var(--navy);margin:0}.login .lead{text-align:center;color:var(--muted);margin:7px 0 24px}.field{margin:13px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.input,.select,.textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.full{width:100%;margin-top:10px}
.modalback{position:fixed;inset:0;background:rgba(20,40,45,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}.modalback.open{display:flex}.modal{background:#fff;border-radius:20px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0;color:var(--navy)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fullrow{grid-column:1/-1}
footer{text-align:center;padding:30px;color:var(--muted);font-size:11px}
@media(max-width:900px){.side{display:none}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.main{padding:17px}.header{padding:0 15px}}
@media(max-width:560px){.grid4,.grid3,.grid2,.formgrid{grid-template-columns:1fr}.hero h1{font-size:22px}.loginbox{padding:24px}}

.bottomnav{display:none}
@media(max-width:900px){.bottomnav{position:fixed;display:flex;bottom:0;right:0;left:0;height:66px;background:rgba(255,255,255,.97);border-top:1px solid #e2eaea;z-index:30;justify-content:space-around;align-items:center}.bottomnav a{font-size:11px;color:#718489;text-align:center;font-weight:800;padding:5px 10px}.bottomnav a.active{color:#278b7c}.bottomnav b{display:block;font-size:21px;line-height:25px}.main{padding-bottom:85px}}
</style></head><body></body><script>
const KEY='maayir-copc-v8';
const SEED=[{"id":1,"name":"سارة أحمد","score":97.8,"aht":"3:05","abs":98,"quality":94,"util":91,"csat":96,"fcr":93,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":2,"name":"ريم محمد","score":94.6,"aht":"3:18","abs":97,"quality":91,"util":89,"csat":94,"fcr":91,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":3,"name":"نورة خالد","score":91.3,"aht":"3:26","abs":96,"quality":88,"util":87,"csat":92,"fcr":89,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":4,"name":"جود عبدالله","score":88.7,"aht":"3:31","abs":95,"quality":85,"util":84,"csat":90,"fcr":87,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":5,"name":"هند علي","score":84.2,"aht":"3:42","abs":94,"quality":81,"util":82,"csat":87,"fcr":84,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":6,"name":"لطيفة سالم","score":79.5,"aht":"3:58","abs":92,"quality":78,"util":79,"csat":83,"fcr":80,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":7,"name":"مشاعل حسن","score":74.1,"aht":"4:10","abs":90,"quality":73,"util":75,"csat":79,"fcr":76,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":8,"name":"أمل يوسف","score":68.9,"aht":"4:25","abs":88,"quality":69,"util":70,"csat":75,"fcr":71,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":9,"name":"رغد إبراهيم","score":61.7,"aht":"4:46","abs":85,"quality":62,"util":65,"csat":68,"fcr":64,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]},{"id":10,"name":"شهد ماجد","score":53.4,"aht":"5:02","abs":81,"quality":54,"util":57,"csat":61,"fcr":58,"reviews":[],"sessions":[],"development":["متابعة الأداء الشهري","تعزيز نقاط القوة","خطة تطوير للشهر القادم"]}];
const KPI=[['aht','AHT','متوسط وقت المكالمات','3:30','20%'],['abs','Absenteeism','الحضور / الانضباط','95%','25%'],['quality','Quality','الجودة','80%','35%'],['util','Utilization','انشغالية الموظفة','85%','20%'],['csat','C-SAT','رضا العميل','—','—'],['fcr','FCR','الحل من أول مكالمة','—','—']];
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{employees:SEED,role:'supervisor',selected:1}}catch(e){return {employees:SEED,role:'supervisor',selected:1}}})();
if(!S.employees||S.employees.length!==10){S={employees:SEED,role:'supervisor',selected:1}} localStorage.setItem(KEY,JSON.stringify(S));
function save(){localStorage.setItem(KEY,JSON.stringify(S))} function emp(id){return S.employees.find(x=>+x.id===+id)||S.employees[0]}
function statClass(x){return x>=90?'pill excellent':x>=80?'pill good':'pill bad'} function status(x){return x>=90?'ممتاز':x>=80?'جيد':x>=65?'يحتاج تطوير':'متابعة مكثفة'} function scoreClass(x){return x>=90?'score-excellent':x>=80?'score-good':'score-low'}
function nav(active){return `<aside class="side"><div class="nav-label">الرئيسية</div><div class="nav">
<a class="${active==='home'?'active':''}" href="dashboard.html">🏠 الصفحة الرئيسية</a>
<div class="nav-label">إدارة الموظفات</div><a class="${active==='employees'?'active':''}" href="employees.html">👩🏻‍💼 الموظفات</a>
<div class="nav-label">الأداء</div><a class="${active==='performance'?'active':''}" href="performance.html">📊 إدارة الأداء</a><a class="${active==='kpi'?'active':''}" href="kpi.html">🎯 KPI</a><a class="${active==='monthly'?'active':''}" href="monthly.html">🗓️ Monthly Performance</a>
<div class="nav-label">الجلسات والتطوير</div><a class="${active==='sessions'?'active':''}" href="coaching.html">💬 الجلسات</a><a class="${active==='side'?'active':''}" href="side-by-side.html">👥 Side by Side</a><a class="${active==='development'?'active':''}" href="development.html">📝 ملاحظات التطوير</a>
<div class="nav-label">التقارير والإدارة</div><a class="${active==='reports'?'active':''}" href="reports.html">📈 التقارير</a><a class="${active==='settings'?'active':''}" href="settings.html">⚙️ الإعدادات</a></div></aside>`}
function shell(title,active,body){document.body.innerHTML=`<header class="header"><div><div class="logo">معايير <span>COPC</span></div><div class="headsub">حساب المشرفة — وجدان</div></div><div class="head-actions"><a class="btn soft" href="employee-home.html?id=1">حساب سارة</a></div></header><div class="layout">${nav(active)}<main class="main">${body}<footer>معايير COPC • منصة تطوير الموظفين وإدارة الأداء</footer></main></div><nav class="bottomnav" id="bottomnav"><a href="dashboard.html" class="active"><b>⌂</b>الرئيسية</a><a href="employees.html"><b>👥</b>الموظفات</a><a href="performance.html"><b>▦</b>الأداء</a><a href="coaching.html"><b>●</b>الجلسات</a><a href="settings.html"><b>⚙</b>الإعدادات</a></nav><div class="modalback" id="mb" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3 id="mt"></h3><button class="btn soft" onclick="closeModal()">إغلاق</button></div><div id="mc"></div></div></div>`}
function openModal(t,c){document.getElementById('mt').textContent=t;document.getElementById('mc').innerHTML=c;document.getElementById('mb').classList.add('open')} function closeModal(){document.getElementById('mb').classList.remove('open')}
function enter(){S.role=document.getElementById('role').value;S.selected=S.role==='employee'?1:0;save();location.href=S.role==='employee'?'employee-home.html?id=1':'dashboard.html'}
function editEmployee(id){let e=emp(id);openModal('تعديل بيانات الموظفة',`<div class="formgrid"><div class="field"><label>الاسم</label><input class="input" id="en" value="${e.name}"></div><div class="field"><label>النتيجة</label><input class="input" id="es" type="number" step=".1" value="${e.score}"></div><div class="field"><label>AHT</label><input class="input" id="ea" value="${e.aht}"></div><div class="field"><label>Absenteeism</label><input class="input" id="eab" type="number" value="${e.abs}"></div><div class="field"><label>Quality</label><input class="input" id="eq" type="number" value="${e.quality}"></div><div class="field"><label>Utilization</label><input class="input" id="eu" type="number" value="${e.util}"></div><div class="field"><label>C-SAT</label><input class="input" id="ec" type="number" value="${e.csat}"></div><div class="field"><label>FCR</label><input class="input" id="ef" type="number" value="${e.fcr}"></div><div class="fullrow"><button class="btn full" onclick="saveEmp($<built-in function id>)">حفظ</button></div></div>`)}
function saveEmp(id){let e=emp(id);Object.assign(e,{name:en.value,score:+es.value,aht:ea.value,abs:+eab.value,quality:+eq.value,util:+eu.value,csat:+ec.value,fcr:+ef.value});save();location.reload()}
function session(id,type){openModal(type==='Coaching Session'?'إضافة Coaching Session':'إضافة Side by Side',`<div class="formgrid"><div class="field"><label>الموظفة</label><select class="select" id="sid">${S.employees.map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input class="input" id="sdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field fullrow"><label>الملاحظات</label><textarea class="textarea" id="snote" rows="5"></textarea></div><div class="fullrow"><button class="btn full" onclick="saveSession('${type}')">حفظ الجلسة</button></div></div>`)}
function saveSession(type){let e=emp(sid.value);e.sessions=e.sessions||[];e.sessions.push({type,date:sdate.value,note:snote.value||'تم تسجيل الجلسة'});save();location.reload()}
function review(id){openModal('Monthly Performance Review',`<div class="formgrid"><div class="field"><label>الموظفة</label><select class="select" id="rid">${S.employees.map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="field"><label>الشهر</label><input class="input" id="rmonth" type="month" value="${new Date().toISOString().slice(0,7)}"></div><div class="field"><label>نقاط القوة</label><textarea class="textarea" id="rstrength" rows="3"></textarea></div><div class="field"><label>فرص التحسين</label><textarea class="textarea" id="rimprove" rows="3"></textarea></div><div class="field"><label>التحديات</label><textarea class="textarea" id="rchallenge" rows="3"></textarea></div><div class="field"><label>خطة التطوير</label><textarea class="textarea" id="rplan" rows="3"></textarea></div><div class="fullrow"><button class="btn full" onclick="saveReview()">حفظ المراجعة</button></div></div>`)}
function saveReview(){let e=emp(rid.value);e.reviews=e.reviews||[];e.reviews.push({month:rmonth.value,strength:rstrength.value,improve:rimprove.value,challenges:rchallenge.value,plan:rplan.value});save();location.reload()}
function kpiCard(key,e){let x=e[key],name=KPI.find(k=>k[0]===key)[1],lab=KPI.find(k=>k[0]===key)[2],target=KPI.find(k=>k[0]===key)[3];let p=key==='aht'?Math.max(0,Math.min(100,210/Math.max(1,parseTime(x))*100)):x;return `<div class="card kpi"><div class="kpi-name">${name}</div><div class="muted">${lab}</div><div class="kpi-val">${x}${key==='aht'?'':'%'}</div><div class="muted">Target: ${target}</div><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div></div>`} function parseTime(t){let a=String(t).split(':').map(Number);return a[0]*60+a[1]}
</script><script>
let avg=S.employees.reduce((a,e)=>a+e.score,0)/S.employees.length;
shell('التقارير','reports',`<div class="hero"><h1>التقارير</h1><p>تقارير قابلة للعرض والطباعة من بيانات الفريق الحالية.</p></div>
<div class="grid3"><div class="card"><h3>تقرير أداء الفريق</h3><p class="muted">متوسط الفريق ${avg.toFixed(1)}%</p><button class="btn full" onclick="window.print()">طباعة التقرير</button></div><div class="card"><h3>تقرير KPI</h3><p class="muted">AHT، الحضور، الجودة، الانشغالية، C-SAT، FCR</p><a class="btn soft full" href="kpi.html">فتح تقرير KPI</a></div><div class="card"><h3>تقرير الجلسات</h3><p class="muted">Coaching وSide by Side</p><a class="btn soft full" href="coaching.html">فتح الجلسات</a></div></div>`);
</script></html>
