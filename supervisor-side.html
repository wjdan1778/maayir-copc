<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="v11"><title>معايير COPC</title><style>
:root{--navy:#203a63;--green:#8cc84b;--teal:#3d8b82;--orange:#e4a13a;--red:#d9535d;--lav:#a695e5;--bg:#f3f5f7;--white:#fff;--text:#263c56;--muted:#7d8999;--line:#e4e8ed;--sg:#edf8e4;--so:#fff4e1;--sr:#ffeaed;--sl:#f2effb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}
.header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}.brand{font-size:22px;font-weight:950;color:var(--navy)}.brand span{color:var(--teal)}.sub{font-size:12px;color:var(--muted);margin-top:2px}.head-actions{display:flex;gap:8px}
.layout{display:flex;min-height:calc(100vh - 76px)}.side{width:255px;background:#fff;border-left:1px solid var(--line);padding:18px;flex:none}.navtitle{font-size:11px;color:var(--muted);margin:15px 8px 7px}.nav a{display:block;padding:11px 12px;border-radius:12px;font-weight:850;margin:3px 0}.nav a.active,.nav a:hover{background:#edf7f4;color:var(--teal)}
.main{width:100%;max-width:1300px;margin:auto;padding:26px}.hero{background:linear-gradient(135deg,#edf8f5,#f3effc);border:1px solid var(--line);border-radius:23px;padding:23px;margin-bottom:18px}.hero h1{margin:0 0 6px;color:var(--navy);font-size:28px}.hero p{margin:0;color:var(--muted);line-height:1.7}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px;box-shadow:0 4px 18px rgba(30,55,80,.035)}.stat .label{font-size:13px;color:var(--muted)}.stat .num{font-size:30px;font-weight:950;color:var(--navy);margin:3px 0 6px}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h2{margin:0;color:var(--navy);font-size:19px}.muted{font-size:13px;color:var(--muted)}
.btn{display:inline-block;border:0;border-radius:11px;padding:10px 15px;background:var(--teal);color:#fff;font-weight:900;cursor:pointer}.btn.soft{background:#eef2f4;color:var(--text)}.btn.lav{background:var(--lav)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.full{width:100%;margin-top:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:900}.excellent{background:var(--sg);color:#568d31}.good{background:var(--so);color:#b56f15}.low{background:var(--sr);color:#bd3d48}
.score{font-weight:950}.score.excellent{color:#568d31}.score.good{color:#c27a18}.score.low{color:#c5424d}
.bar{height:9px;background:#e9edf1;border-radius:20px;overflow:hidden;margin-top:9px}.bar i{height:100%;display:block;border-radius:20px}.bar.green i{background:var(--green)}.bar.orange i{background:var(--orange)}.bar.red i{background:var(--red)}
.shortcut{display:flex;align-items:center;gap:12px;min-height:92px}.ico{width:45px;height:45px;border-radius:14px;background:#edf7f4;display:grid;place-items:center;font-size:21px}.shortcut h3{margin:0 0 4px}.shortcut p{margin:0;color:var(--muted);font-size:12px}
.alert{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:14px;margin:8px 0}.alert.red{background:var(--sr);border-right:4px solid var(--red)}.alert.orange{background:var(--so);border-right:4px solid var(--orange)}.alert.green{background:var(--sg);border-right:4px solid var(--green)}.alert h3{margin:0 0 4px;font-size:15px}.alert p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted)}
.kpi{min-height:140px}.kpi .name{font-weight:900}.kpi .val{font-size:25px;font-weight:950;color:var(--navy);margin:4px 0}.target{font-size:12px;color:var(--muted)}
.note{background:#fbfbfd;border-right:4px solid var(--lav);border-radius:12px;padding:12px 14px;margin:8px 0;line-height:1.7}.note strong{display:block;color:var(--navy);margin-bottom:3px}
.schedule{border-right:4px solid var(--teal);background:#f4faf9}.timer{font-size:26px;font-weight:950;color:var(--navy);letter-spacing:.5px}.calendarrow{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:9px;align-items:end}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f2f7f6,#f1effb)}.loginbox{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 18px 50px rgba(30,55,80,.08)}.logoBox{width:78px;height:78px;border-radius:23px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:950;font-size:23px;margin:0 auto 15px}.login h1{text-align:center;color:var(--navy);margin:0}.login .lead{text-align:center;color:var(--muted);margin:6px 0 24px}.field{margin:12px 0}.field label{display:block;font-weight:850;margin-bottom:7px}.input,.select,.textarea{width:100%;padding:12px;border:1px solid #dfe5e9;border-radius:11px;background:#fff;outline:none}
.bottom{display:none}footer{text-align:center;color:var(--muted);font-size:11px;padding:28px}
@media(max-width:900px){.side{display:none}.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.main{padding:17px;padding-bottom:88px}.bottom{display:flex;position:fixed;bottom:0;right:0;left:0;height:68px;background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:50;justify-content:space-around}.bottom a{text-align:center;padding:8px 9px;color:var(--muted);font-size:11px;font-weight:850}.bottom b{display:block;font-size:20px}.calendarrow{grid-template-columns:1fr 1fr}.calendarrow .fullrow{grid-column:1/-1}}
@media(max-width:560px){.grid4,.grid3,.grid2{grid-template-columns:1fr}.hero h1{font-size:22px}.calendarrow{grid-template-columns:1fr}.loginbox{padding:24px}}
</style></head><body></body><script>
const DATA=[{"id":1,"name":"سارة أحمد","score":97.8,"aht":"3:05","abs":98,"quality":94,"util":91,"csat":96,"fcr":93},{"id":2,"name":"ريم محمد","score":94.6,"aht":"3:18","abs":97,"quality":91,"util":89,"csat":94,"fcr":91},{"id":3,"name":"نورة خالد","score":91.3,"aht":"3:26","abs":96,"quality":88,"util":87,"csat":92,"fcr":89},{"id":4,"name":"جود عبدالله","score":88.7,"aht":"3:31","abs":95,"quality":85,"util":84,"csat":90,"fcr":87},{"id":5,"name":"هند علي","score":84.2,"aht":"3:42","abs":94,"quality":81,"util":82,"csat":87,"fcr":84},{"id":6,"name":"لطيفة سالم","score":79.5,"aht":"3:58","abs":92,"quality":78,"util":79,"csat":83,"fcr":80},{"id":7,"name":"مشاعل حسن","score":74.1,"aht":"4:10","abs":90,"quality":73,"util":75,"csat":79,"fcr":76},{"id":8,"name":"أمل يوسف","score":68.9,"aht":"4:25","abs":88,"quality":69,"util":70,"csat":75,"fcr":71},{"id":9,"name":"رغد إبراهيم","score":61.7,"aht":"4:46","abs":85,"quality":62,"util":65,"csat":68,"fcr":64},{"id":10,"name":"شهد ماجد","score":53.4,"aht":"5:02","abs":81,"quality":54,"util":57,"csat":61,"fcr":58}];const KEY='maayir-copc-v11';let S=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.employees?.length===10?x:{employees:DATA,schedules:[]}}catch(e){return {employees:DATA,schedules:[]}}})();localStorage.setItem(KEY,JSON.stringify(S));
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function emp(id){return S.employees.find(e=>+e.id===+id)||S.employees[0]}function cls(x){return x>=90?'excellent':x>=80?'good':'low'}function status(x){return x>=90?'ممتاز':x>=80?'جيد':'منخفض'}function action(e){if(e.score>=90)return'الحفاظ على المستوى ومشاركة أفضل الممارسات';if(e.score>=80)return'متابعة شهرية وتحسين المؤشرات الأقل من Target';if(e.score>=65)return'تحديد Coaching وخطة تحسين ومتابعة أسبوعية';return'Coaching فوري وخطة تحسين مكثفة ومتابعة أسبوعية'}function notes(e){let a=[];if(e.quality<80)a.push('رفع الجودة ومراجعة أخطاء المكالمات.');if(e.util<85)a.push('رفع Utilization ومراجعة توزيع وقت العمل.');if(e.csat<80)a.push('تحسين تجربة العميل ورضاه.');if(e.fcr<80)a.push('تعزيز الحل من أول مكالمة.');if(e.aht>'3:30')a.push('خفض AHT تدريجيًا مع المحافظة على الجودة.');return a.length?a:['الحفاظ على الأداء المتميز والاستمرار في المتابعة.']}
function nav(a){return`<aside class="side"><div class="navtitle">لوحة المشرفة</div><div class="nav"><a class="${a==='home'?'active':''}" href="supervisor.html">🏠 الرئيسية</a><div class="navtitle">إدارة الأداء</div><a class="${a==='performance'?'active':''}" href="supervisor-performance.html">📊 الأداء العام</a><a href="supervisor-kpi.html">🎯 معايير KPI</a><a href="supervisor-monthly.html">🗓️ Monthly Performance</a><div class="navtitle">الموظفات</div><a href="supervisor-employees.html">👩🏻‍💼 الموظفات</a><a href="supervisor-reports.html">🖨️ تقارير الموظفات</a><div class="navtitle">الجلسات والتطوير</div><a href="supervisor-sessions.html">💬 الجلسات والمواعيد</a><a href="supervisor-side.html">👥 Side by Side</a><a href="supervisor-coaching.html">🎓 Coaching Session</a><a href="supervisor-development.html">📝 ملاحظات التطوير</a><a href="supervisor-alerts.html">🔔 التنبيهات</a></div></aside>`}
function sup(body,a=''){document.body.innerHTML=`<header class="header"><div><div class="brand">معايير <span>COPC</span></div><div class="sub">حساب المشرفة — وجدان</div></div><div class="head-actions"><a class="btn soft" href="employee-home.html">حساب سارة</a><a class="btn soft" href="index.html">خروج</a></div></header><div class="layout">${nav(a)}<main class="main">${body}<footer>معايير COPC • الغرض: تطوير الموظفين • طابع عصري مؤسسي</footer></main></div><nav class="bottom"><a href="supervisor.html"><b>⌂</b>الرئيسية</a><a href="supervisor-performance.html"><b>📊</b>الأداء</a><a href="supervisor-sessions.html"><b>💬</b>الجلسات</a><a href="supervisor-alerts.html"><b>🔔</b>التنبيهات</a></nav>`}
function employee(body){document.body.innerHTML=`<header class="header"><div><div class="brand">معايير <span>COPC</span></div><div class="sub">حساب الموظفة — سارة أحمد</div></div><a class="btn soft" href="index.html">خروج</a></header><main class="main">${body}<footer>معايير COPC • ملف الموظفة الخاص</footer></main><nav class="bottom"><a href="employee-home.html"><b>⌂</b>الرئيسية</a><a href="employee-kpi.html"><b>📊</b>الأداء</a><a href="employee-monthly.html"><b>🗓</b>المراجعة</a><a href="employee-coaching.html"><b>💬</b>الجلسات</a></nav>`}
function parseTime(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function kpi(e,k,n,t){let v=e[k],w=k==='aht'?Math.min(100,210/parseTime(v)*100):v,c=k==='aht'?(parseTime(v)<=210?'green':'orange'):(v>=90?'green':v>=80?'orange':'red');return`<div class="card kpi"><div class="name">${n}</div><div class="target">Target: ${t}</div><div class="val">${v}${k==='aht'?'':'%'}</div><div class="bar ${c}"><i style="width:${w}%"></i></div></div>`}
function scheduleForm(pref=1){let opts=S.employees.map(e=>`<option value="${e.id}" ${e.id==pref?'selected':''}>${e.name}</option>`).join('');return`<div class="card schedule"><div class="calendarrow"><div class="field"><label>الموظفة</label><select class="select" id="se">${opts}</select></div><div class="field"><label>نوع الجلسة</label><select class="select" id="st"><option>Coaching Session</option><option>Side by Side</option></select></div><div class="field"><label>التاريخ والوقت</label><input class="input" id="sd" type="datetime-local"></div><button class="btn" onclick="addSchedule()">حفظ الموعد</button></div></div>`}
function addSchedule(){let d=document.getElementById('sd').value;if(!d)return alert('اختاري التاريخ والوقت');S.schedules.push({id:Date.now(),employee:+se.value,type:st.value,date:d});save();location.reload()}
function countdown(date){let ms=new Date(date)-Date.now();if(ms<=0)return'بدأ الموعد أو انتهى';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);let sec=s%60;return`${d?d+' يوم ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function tick(){document.querySelectorAll('[data-date]').forEach(x=>x.textContent=countdown(x.dataset.date));}setInterval(tick,1000);
function printEmp(id){location.href='supervisor-report.html?id='+id}
function enter(){let r=document.getElementById('role').value;location.href=r==='supervisor'?'supervisor.html':'employee-home.html'}
</script><script>
sup(`<div class="hero"><h1>Side by Side</h1><p>جلسة ربع سنوية يتم خلالها الجلوس مع الموظفة والاستماع للمكالمات وتقديم الملاحظات اللازمة، ثم تقييم المكالمة على Speechlog.</p></div><div class="grid2">${S.employees.map(e=>`<div class="card"><h3>${e.name}</h3><div class="note"><strong>محتوى الجلسة</strong>تقييم المكالمات مباشرة، الاستماع للمكالمات، تقديم الملاحظات، ثم التقييم على Speechlog.</div><a class="btn lav full" href="supervisor-sessions.html?employee=${e.id}">📅 تحديد موعد</a></div>`).join('')}</div>`,'sessions');
</script></html>
